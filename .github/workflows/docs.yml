name: documentation

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt
      - name: Install wavesongs
        run: |
          pip install -e .
      - name: Sphinx build
        run: |
          sphinx-build docs _build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          publish_branch: gh-pages
          # github_token: ${{ secrets.EXTERNAL_REPO_PAT }}  # <-- THIS FIXES THE ERROR
          # github_token: ${{ secrets.EXTERNAL_REPO_TOKEN }}
          external_repository: wavesongs/wavesongs.github.io
          publish_dir: _build/
          force_orphan: true
        env:
          $GITHUB_TOKEN: ${{ secrets.EXTERNAL_REPO_PAT }}
