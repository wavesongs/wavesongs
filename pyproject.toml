[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "wavesongs"
version = "0.0.7b1"
description = "A python package for birdsongs creation and data extraction."
license = "GPL-3.0"
authors = [
    { name = "Sebastian Aguilera Novoa", email = "saguileran@ime.usp.br" },
]
maintainers = [
    { name = "Sebastian Aguilera Novoa", email = "saguileran@ime.usp.br" },
]
keywords = [ "numerical methods", "motor gestures", "birdsongs", "syhnthetic songs" ]
readme = "README.md"
requires-python = "<4.0,>=3.11"
dependencies = [
    "numpy (<2)",
    "librosa (>=0.11.0,<0.12.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "debugpy (>=1.8.17,<2.0.0)",
    "ipykernel (>=7.1.0,<8.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "sympy (>=1.14.0,<2.0.0)",
    "scikit-maad (>=1.5.1,<2.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "plotly (>=6.5.0,<7.0.0)",
    "ipympl (>=0.9.8,<0.10.0)",
    "mpl-point-clicker (>=0.4.1,<0.5.0)",
    "mpl-pan-zoom (>=1.1.0,<2.0.0)"
]
dynamic = [ "classifiers" ]

[tool.poetry]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Scientific/Engineering :: Physics"
]

[project.urls]
homepage = "https://wavesongs.github.io/"
repository = "https://github.com/wavesongs/wavesongs/"
documentation = "https://wavesongs.github.io/"

[project.optional-dependencies]
dev = [
    "ipykernel",
    "black",
    "poetry"
]
test = ["pytest >= 7"]

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "*"
myst-nb = "^1.2.0"
sphinx = "^8.1.3"
sphinx-copybutton = "^0.5.2"
sphinx-design = "^0.6.1"
sphinxcontrib-bibtex = "^2.6.3"
sphinx-togglebutton = "^0.3.2"
sphinx-gallery = "^0.19.0"
memory-profiler = "^0.61.0"
sphinx-autoapi = "^3.6.0"
sphinx-icon = "^0.2.2"
sphinx-favicon = "^1.0.1"
graphviz = "^0.21"
pydata-sphinx-theme = "^0.16.1"
sphinx-sitemap = "^2.7.2"
sphinx-autodoc-typehints = "^3.2.0"
kaleido = "^1.0.0"

[tool.poetry.group.dev.dependencies]
poetry = "^2.0.1"
black = "^25.1.0"
